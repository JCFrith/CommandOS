name: Production Validation (Sprint 6.5)

# Manually-invoked ONLY. This is the release gate for Sprint 6.5's production
# persistence: it stands up (or connects to) a REAL PostgreSQL/Supabase database
# and runs the full database-backed validation package. It is never triggered by
# push/PR — a human runs it, reviews the uploaded artifacts, and only then merges.
#
# Two paths (choose via the `mode` input):
#   local  — ephemeral Supabase stack via the Supabase CLI + Docker on the runner.
#   hosted — an isolated, disposable hosted Supabase project via repository secrets.
#            NEVER point this at a production project or real customer data.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit SHA or branch to validate (defaults to the ref this workflow runs on).'
        required: false
        type: string
      mode:
        description: 'Validation target: local (ephemeral CLI stack) or hosted (isolated Supabase project via secrets).'
        required: true
        default: local
        type: choice
        options: [local, hosted]
      allow_validation_reset:
        description: 'HOSTED ONLY: drop the isolated staging APPLICATION schema (via the immutable migrations rollback files) before applying, for a deterministic empty start. Never runs in local mode; never touches Supabase-managed schemas or a production project.'
        required: false
        default: false
        type: boolean

# Never run two validations against the same target concurrently.
concurrency:
  group: production-validation-${{ github.event.inputs.mode }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PRODUCTION_VALIDATION: '1'
      # Guardrail: refuse to run destructive validation against a recognized
      # production project unless an operator explicitly overrides in a hosted run.
      ALLOW_DESTRUCTIVE_VALIDATION: ${{ github.event.inputs.mode == 'hosted' && secrets.ALLOW_DESTRUCTIVE_VALIDATION || '' }}
    steps:
      - name: Check out the requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          # 22+ is required: @supabase/supabase-js initializes a realtime client
          # that needs a native global WebSocket (absent on Node 20). Production
          # runs Node 24 on Vercel; 22 is the recommended floor and satisfies the
          # project's `engines.node >=20`.
          node-version: 22
          cache: npm

      - name: Install dependencies (locked)
        run: npm ci

      - name: Install the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # The runner ships pg_dump 16, but hosted Supabase projects run Postgres 17+,
      # and pg_dump refuses to dump a NEWER server. Install the PostgreSQL 17 client
      # from the PGDG apt repo and put it first on PATH so psql/pg_dump match (or
      # exceed) the server. Safe for local mode too (newer client dumps older servers).
      - name: Install PostgreSQL 17 client (pg_dump ≥ hosted server)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      # ---- LOCAL MODE: ephemeral Supabase stack ---------------------------------
      - name: Start local Supabase stack
        if: ${{ github.event.inputs.mode == 'local' }}
        run: supabase start

      - name: Apply canonical migration (local)
        if: ${{ github.event.inputs.mode == 'local' }}
        run: supabase migration up --local

      - name: Export local validation credentials
        if: ${{ github.event.inputs.mode == 'local' }}
        run: |
          # `supabase status -o env` prints KEY=value lines; map them to SUPABASE_TEST_*.
          eval "$(supabase status -o env)"
          {
            echo "SUPABASE_TEST_URL=${API_URL}"
            echo "SUPABASE_TEST_ANON_KEY=${ANON_KEY}"
            echo "SUPABASE_TEST_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
            echo "SUPABASE_TEST_DB_URL=${DB_URL}"
            # Well-known local development JWT secret (safe to expose; local-only).
            echo "SUPABASE_TEST_JWT_SECRET=super-secret-jwt-token-with-at-least-32-characters-long"
          } >> "$GITHUB_ENV"

      # ---- HOSTED MODE: isolated disposable project -----------------------------
      - name: Export hosted validation credentials
        if: ${{ github.event.inputs.mode == 'hosted' }}
        env:
          H_URL: ${{ secrets.SUPABASE_TEST_URL }}
          H_ANON: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
          H_SERVICE: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
          H_DB: ${{ secrets.SUPABASE_TEST_DB_URL }}
          H_JWT: ${{ secrets.SUPABASE_TEST_JWT_SECRET }}
        run: |
          # Mask before writing so nothing lands in logs.
          for v in "$H_URL" "$H_ANON" "$H_SERVICE" "$H_DB" "$H_JWT"; do
            [ -n "$v" ] && echo "::add-mask::$v"
          done
          if [ -z "$H_URL" ] || [ -z "$H_SERVICE" ] || [ -z "$H_DB" ]; then
            echo "FAIL: hosted mode requires SUPABASE_TEST_URL / SERVICE_ROLE_KEY / DB_URL secrets." >&2
            exit 1
          fi
          {
            echo "SUPABASE_TEST_URL=${H_URL}"
            echo "SUPABASE_TEST_ANON_KEY=${H_ANON}"
            echo "SUPABASE_TEST_SERVICE_ROLE_KEY=${H_SERVICE}"
            echo "SUPABASE_TEST_DB_URL=${H_DB}"
            echo "SUPABASE_TEST_JWT_SECRET=${H_JWT}"
          } >> "$GITHUB_ENV"

      # HOSTED-ONLY, OPT-IN destructive reset of the ISOLATED staging APPLICATION
      # schema. Earlier failed runs can leave partial/misordered CommandOS objects
      # (e.g. a workflow_timers created with an inline node_id by a since-reverted
      # migration) whose column order diverges from a clean chain, failing the
      # deterministic schema comparison. This drops ONLY CommandOS application
      # objects via the immutable migrations' rollback files so the chain rebuilds
      # deterministically. It NEVER touches Supabase-managed schemas (auth, storage,
      # realtime, extensions, internal objects), NEVER runs in local mode, and fails
      # closed unless BOTH validation markers are present and the target is not a
      # recognized production project. Not available to ordinary CI (ci.yml).
      - name: Reset isolated staging application schema (hosted, opt-in)
        if: ${{ github.event.inputs.mode == 'hosted' && github.event.inputs.allow_validation_reset == 'true' }}
        env:
          PROD_URL: ${{ secrets.PRODUCTION_URL }}
          ALLOW_VALIDATION_RESET: 'true'
        run: |
          set -euo pipefail
          # Fail closed: require BOTH validation markers, real staging credentials,
          # and a target that is NOT the recognized production project.
          if [ "${PRODUCTION_VALIDATION:-}" != "1" ]; then
            echo "FAIL: PRODUCTION_VALIDATION!=1 — refusing destructive reset." >&2; exit 1
          fi
          if [ "${ALLOW_VALIDATION_RESET:-}" != "true" ]; then
            echo "FAIL: ALLOW_VALIDATION_RESET marker absent — refusing destructive reset." >&2; exit 1
          fi
          if [ -z "${SUPABASE_TEST_DB_URL:-}" ] || [ -z "${SUPABASE_TEST_URL:-}" ]; then
            echo "FAIL: staging validation credentials missing — refusing reset." >&2; exit 1
          fi
          if [ -n "${PROD_URL:-}" ] && [ "${SUPABASE_TEST_URL}" = "${PROD_URL}" ]; then
            echo "FAIL: target is the recognized production project — refusing reset." >&2; exit 1
          fi
          echo "Hosted validation reset: isolated staging application schema only"
          # Drop CommandOS application objects ONLY, newest immutable migration first.
          # These rollback files reference only public-schema app tables/functions;
          # Supabase-managed schemas, extensions, and auth/storage/realtime are untouched.
          psql "$SUPABASE_TEST_DB_URL" -v ON_ERROR_STOP=1 -f supabase/rollback/20260807000000_durable_triggers_rollback.sql
          psql "$SUPABASE_TEST_DB_URL" -v ON_ERROR_STOP=1 -f supabase/rollback/20260729000000_production_foundation_rollback.sql
          # Verify every CommandOS application table from the immutable chain is gone
          # (we inspect only public app tables; Supabase-managed schemas stay intact).
          LEFT=$(psql "$SUPABASE_TEST_DB_URL" -t -A -c "select count(*) from information_schema.tables where table_schema='public' and table_name in ('workspaces','workspace_members','operations','operation_activity','agents','agent_activity','agent_executions','execution_logs','signals','signal_events','signal_subscriptions','workflows','workflow_versions','workflow_runs','workflow_step_runs','workflow_approvals','workflow_timers','trigger_claims','schedule_occurrences','jobs','trigger_scan_cursor');")
          if [ "$LEFT" != "0" ]; then
            echo "FAIL: reset left $LEFT CommandOS application table(s) behind — aborting." >&2; exit 1
          fi
          echo "Reset verified: 0 CommandOS application tables remain; Supabase-managed schemas preserved."

      - name: Apply canonical migration + validation helpers (hosted)
        if: ${{ github.event.inputs.mode == 'hosted' }}
        run: |
          for f in supabase/migrations/*.sql; do
            echo "applying $f"
            psql "$SUPABASE_TEST_DB_URL" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Apply validation-only helpers
        run: psql "$SUPABASE_TEST_DB_URL" -v ON_ERROR_STOP=1 -f supabase/validation/reset.sql

      # ---- RUN THE VALIDATION PACKAGE -------------------------------------------
      - name: Run production validation (fail-closed)
        run: npm run validate:production

      # ---- ARTIFACTS (always) ---------------------------------------------------
      - name: Upload validation artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: production-validation-${{ github.event.inputs.mode }}-${{ github.run_id }}
          path: artifacts/production-validation/
          if-no-files-found: warn
          retention-days: 30

      # ---- CLEANUP (always) -----------------------------------------------------
      - name: Stop local Supabase stack
        if: ${{ always() && github.event.inputs.mode == 'local' }}
        run: supabase stop --no-backup || true
